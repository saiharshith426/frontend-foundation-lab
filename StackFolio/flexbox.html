<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .flex-container{
            background-color:aqua;
            padding:16px;
            display:flex;
            flex-direction:row;
            justify-content:center;
            align-items:center;
            height:900px;
            gap:10px;
        }
        .flex-box{
            background-color:salmon;
            color:white;
            padding:20px 30px;
            font-size:20px;
            border:1px solid black;
        }
        .flex-container2{
            background-color: #cccccc;
            display: flex;
            gap:16px;
            padding:16px;
        }
        .growbox{
            background-color: #2563eb;
            color:white;
            padding: 20px;
            text-align: center;
            font-size:18px;
            flex-grow: 1;
        }
        /* #box-b{
            flex-grow:2;
        } */
        #box-a{
            flex-basis:200px;
        }
    </style>
</head>
<body>
    <div class="flex-container">
        <div class="flex-box">Box 1</div>
        <div class="flex-box">Box 2</div>
        <div class="flex-box">Box 3</div>
        <div class="flex-box">Box 4</div>
        <div class="flex-box">Box 5</div>
    </div>

    <div class="flex-container2">
        <div class="flex-box growbox" id="box-a">Box A</div>
        <div class="flex-box growbox" id="box-b">Box B</div>
        <div class="flex-box growbox" id="box-c">Box C</div>
    </div>
</body>
</html>
