<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .grid-item{
            background-color:blue;
            padding:20px;
            text-align: center;
            color:white;
            border:1px solid black;
            border-radius:4px;
        }
        .grid-container{
            /* height: 600px; */
            display: grid;
            padding:12px;
            background-color:#e2e8f0;
            grid-template-columns:repeat(4,1fr);
            grid-template-rows:1fr 2fr;
            gap:16px 32px;
            /* place-items: center; */
        }

        .page-layout{
            display: grid;
            grid-template-columns: 10vw 1fr 20vw;
            grid-template-rows: 10vh 1fr 10vh;
            background-color: #e2e8f0;
            height: 400px;
            padding:8px;
            grid-template-areas: 
            "header header header"
            "sidebar  main sidebar2"
            "sidebar  footer footer";
            gap:16px;
            height: 100vh;
            width:100vw;
        }
        .page-header{
            grid-area:header;
            background-color: #1f2937;
            color:white;
            padding:16px;
        }
        .page-sidebar{
            grid-area:sidebar;
            background-color: #2563eb;
            padding:16px;
            color:white;
        }
        .page-main{
            grid-area:main;
            background-color: #ffff;
            padding: 16px;
        }
         .page-sidebar2{
            grid-area:sidebar2;
            background-color: #2563eb;
            padding:16px;
            color:white;
        }

        .page-footer{
            grid-area:footer;
            background-color: #1f2937;
            padding: 16px;
            color: white;
        }

        

    </style>
</head>
<body>
    <!-- <div class="grid-container">
        <div class="grid-item">Item 1</div>
        <div class="grid-item">Item 2</div>
        <div class="grid-item">Item 3</div>
        <div class="grid-item">Item 4</div>
        <div class="grid-item">Item 5</div>
        <div class="grid-item">Item 6</div>
    </div> -->
    <div class="page-layout">
        <header class="page-header">Header</header>
        <aside class="page-sidebar">Side bar</aside>
        <main class="page-main">Main Content</main>
        <aside class="page-sidebar2">Side bar</aside>
        <footer class="page-footer">Footer</footer>
    </div>
</body>
</html>
